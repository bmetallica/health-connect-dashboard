services:
  db:
    image: mariadb:11.4
    container_name: huawei-health-db
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Berlin
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./data/mariadb:/var/lib/mysql   # persistente Datenbank
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # kein Port nach außen: nur die App greift auf die Datenbank zu

  health:
    build: .
    container_name: huawei-health
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      INGEST_TOKEN: ${INGEST_TOKEN:-}   # optional: Zugangstoken für den Ingest-Port
      TZ: Europe/Berlin
    ports:
      - "8321:8321"   # Ingest-Endpunkt (JSON entgegennehmen)
      - "8322:8322"   # Webinterface
    volumes:
      - ./data:/data  # Rohdaten-Archiv, App-Download, Altdaten
    restart: unless-stopped
